name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
        timeout-minutes: 5

  plan:
    name: Release plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/release/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: .github/release
      - run: node tests/release/plan.mjs

  pack:
    name: Pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - if: inputs.version != ''
        run: npm version "$VERSION" --no-git-tag-version
        env:
          VERSION: ${{ inputs.version }}
      - id: pack
        run: |
          mkdir "$RUNNER_TEMP/package"
          npm pack --pack-destination "$RUNNER_TEMP/package"
          version=$(node -p "require('./package.json').version")
          node tests/package/check-tarball.mjs "$RUNNER_TEMP"/package/*.tgz --version "$version"
          cd "$RUNNER_TEMP/package"
          sha256sum -- *.tgz > SHA256SUMS
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Install (${{ matrix.os }}, Node ${{ matrix.node }}, npm ${{ matrix.npm }})
    needs: pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22, 24, 26]
        npm: [bundled]
        include:
          - { os: windows-11-arm, node: 24, npm: bundled }
          - { os: macos-15-intel, node: 24, npm: bundled }
          - { os: ubuntu-24.04-arm, node: 24, npm: bundled }
          - { os: windows-latest, node: 24, npm: 12 }
          - { os: macos-latest, node: 24, npm: 12 }
          - { os: ubuntu-latest, node: 24, npm: 12 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tests/package
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: package
      - env:
          NPM: ${{ matrix.npm }}
        run: |
          if [ "$NPM" = bundled ]; then
            npm --version
            npm install --global ./package/*.tgz
          else
            npx --yes "npm@$NPM" --version
            npx --yes "npm@$NPM" install --global ./package/*.tgz
          fi
      - env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: node tests/package/smoke.mjs "$(npm prefix --global)" --version "$VERSION"

  required:
    name: Required checks
    if: always()
    needs: [test, plan, pack, verify]
    runs-on: ubuntu-latest
    steps:
      - env:
          TEST: ${{ needs.test.result }}
          PLAN: ${{ needs.plan.result }}
          PACK: ${{ needs.pack.result }}
          VERIFY: ${{ needs.verify.result }}
        run: |
          echo "test: $TEST, plan: $PLAN, pack: $PACK, verify: $VERIFY"
          [ "$TEST" = success ] && [ "$PLAN" = success ] && [ "$PACK" = success ] && [ "$VERIFY" = success ]
