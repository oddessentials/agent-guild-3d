name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|revert|docs|style|refactor|test|build|ci|chore)(\([^()]+\))?!?: [^ ].*$'
          if ! printf '%s\n' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::The pull request title becomes the commit on main and decides the next version. Use a Conventional Commit title such as \"feat: add a thing\" or \"fix(usage): handle an empty reply\"."
            exit 1
          fi
